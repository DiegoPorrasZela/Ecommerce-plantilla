    <meta charset="UTF-8" />

      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="estilos/navbar.css" />
    <link rel="stylesheet" href="estilos/items-productos.css" />
    <link rel="stylesheet" href="estilos/footer.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <a class="navbar-brand mb-0 h1" href="index.html">GAMS</a>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="hombres.html">Hombres</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="niños.html">Niños</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Colecciones
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="anime.html">Anime</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="deporte.html">Deporte</a>
                  </li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="conocenos.html">Conócenos</a>
              </li>
            </ul>
          </div>
          <div class="user-icons">
            <a href="login.html" class="nav-link text-white">
              <i class="bi bi-person-circle fs-4"></i>
            </a>
            <a href="#" class="nav-link text-white position-relative">
              <i class="bi bi-cart3 fs-4"></i>
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              >
                0
              </span>
            </a>
          </div>
        </div>
      </nav>
    </header>
    <main class="container my-5">
      <h2 class="mb-4">Productos de Niños Destacados</h2>
      <div
        class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
        id="product-container"
      ></div>
    </main>
    <div class="modal fade" id="comprarModal" tabindex="-1" aria-labelledby="comprarModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="comprarModalLabel">Confirmar compra</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-4">
                <img id="modal-product-img" src="" alt="Producto" class="img-fluid">
              </div>
              <div class="col-md-8">
                <h5 id="modal-product-name"></h5>
                <p><strong>Marca: </strong><span id="modal-product-brand"></span></p>
                <p><strong>Precio: </strong>S/ <span id="modal-product-price"></span></p>
                <div class="mb-3">
                  <label for="product-size" class="form-label">Talla:</label>
                  <select class="form-select" id="product-size" required>
                    <option value="" selected disabled>Seleccionar talla</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="quantity" class="form-label">Cantidad:</label>
                  <input type="number" class="form-control" id="quantity" min="1" value="1">
                </div>
                <div class="mb-3">
                  <label for="delivery-address" class="form-label">Dirección de entrega:</label>
                  <textarea class="form-control" id="delivery-address" rows="2" placeholder="Ingresa tu dirección completa"></textarea>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-confirmar-compra">Confirmar compra</button>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div class="container">
        <div class="footer-content">
          <div>
            <p class="mb-0">© 2025 GAMS. Todos los derechos reservados.</p>
          </div>
          <div class="social-links">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-pinterest"></i></a>
          </div>
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/niños.js"></script>
  </body>
</html>
